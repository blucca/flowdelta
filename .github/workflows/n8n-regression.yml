name: n8n render-loop regression example
on:
  push:
    paths:
      - examples/ci-checks/render-*.json
      - examples/ci-checks/render.case.json
      - .github/workflows/n8n-regression.yml
  pull_request:
    paths:
      - examples/ci-checks/render-*.json
      - examples/ci-checks/render.case.json
      - .github/workflows/n8n-regression.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-loop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Repaired expression handles failure and polling
        id: fixed
        uses: blucca/n8n-check@1a9439e7b0d448fa22d530bca4cc8497f1838369
        with:
          workflow: examples/ci-checks/render-fixed.json
          case: examples/ci-checks/render.case.json
          out: results/fixed
      - name: Original expression reproduces the regression
        id: broken
        continue-on-error: true
        uses: blucca/n8n-check@1a9439e7b0d448fa22d530bca4cc8497f1838369
        with:
          workflow: examples/ci-checks/render-broken.json
          case: examples/ci-checks/render.case.json
          out: results/broken
      - name: Confirm the demonstration caught a real failure
        if: always()
        env:
          FIXED_OUTCOME: ${{ steps.fixed.outcome }}
          BROKEN_OUTCOME: ${{ steps.broken.outcome }}
        run: |
          test "$FIXED_OUTCOME" = success
          test "$BROKEN_OUTCOME" = failure
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import assert from "node:assert/strict";
            const fixed = JSON.parse(readFileSync("results/fixed/report.json"));
            const broken = JSON.parse(readFileSync("results/broken/report.json"));
            assert.equal(fixed.exitCode, 0);
            assert.equal(fixed.checks.length, 9);
            assert.equal(fixed.requests.length, 7);
            assert.equal(broken.exitCode, 1);
            assert.equal(broken.requests.length, 0);
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-loop-json-and-junit
          path: |
            results/fixed/report.json
            results/fixed/junit.xml
            results/broken/report.json
            results/broken/junit.xml
